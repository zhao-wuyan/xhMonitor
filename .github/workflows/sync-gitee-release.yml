name: Trigger Gitee Release Sync

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 源 GitHub release tag，例如 v0.2.21。留空时优先使用当前选择的 tag ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync-gitee:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GITEE_OWNER: zhaowuyan
      GITEE_REPO: xhMonitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          INPUT_TAG="${{ inputs.source_tag }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" && -n "$REF_NAME" ]]; then
            TAG="$REF_NAME"
          else
            echo "Choose a tag ref or fill source_tag." >&2
            exit 1
          fi

          if [[ -z "$TAG" || "$TAG" == "latest" ]]; then
            echo "source_tag must be a real release tag, not latest." >&2
            exit 1
          fi

          if ! gh release view "$TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "No published GitHub release found for tag: $TAG" >&2
            exit 1
          fi

          IS_PRERELEASE="$(gh release view "$TAG" -R "$GH_REPO" --json isPrerelease --jq '.isPrerelease')"
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "Prerelease $TAG will not be synced to Gitee latest." >&2
            exit 1
          fi

          SOURCE_COMMIT="$(gh api "repos/${GH_REPO}/commits/$TAG" --jq '.sha')"
          VERSION="${TAG#v}"
          EXPECTED_LITE_SETUP="XhMonitor-v$VERSION-Lite-Setup.exe"

          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "EXPECTED_LITE_SETUP=$EXPECTED_LITE_SETUP"
          } >> "$GITHUB_ENV"

      - name: Wait for GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 40); do
            ASSET_COUNT="$(gh api "repos/${GH_REPO}/releases/tags/$TAG" --jq '.assets | length')"
            HAS_LITE_SETUP="$(gh api "repos/${GH_REPO}/releases/tags/$TAG" --jq '.assets[].name' | grep -Fx "$EXPECTED_LITE_SETUP" || true)"

            echo "Attempt $attempt: assets=$ASSET_COUNT"
            if [[ "$ASSET_COUNT" -ge 5 && -n "$HAS_LITE_SETUP" ]]; then
              echo "GitHub release assets are ready."
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for GitHub release assets." >&2
          exit 1

      - name: Push release tags to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GITEE_TOKEN:-}" ]]; then
            echo "Missing GitHub secret: GITEE_TOKEN" >&2
            exit 1
          fi

          git remote add gitee "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          if git ls-remote --exit-code gitee "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Gitee tag already exists: $TAG"
          else
            git push gitee "refs/tags/$TAG:refs/tags/$TAG"
          fi

          git tag -f latest "$SOURCE_COMMIT"
          git push gitee "refs/tags/latest:refs/tags/latest" --force
          echo "Gitee tags are ready. Gitee Go should sync release attachments from GitHub."
