name: Sync Gitee Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 源 GitHub release tag，例如 v0.2.21。留空时优先使用当前选择的 tag ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync-gitee:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GITEE_OWNER: zhaowuyan
      GITEE_REPO: xhMonitor
      GITEE_API_BASE: https://gitee.com/api/v5
      GITEE_UPLOAD_MAX_TIME_SECONDS: 1200

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          INPUT_TAG="${{ inputs.source_tag }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" && -n "$REF_NAME" ]]; then
            TAG="$REF_NAME"
          else
            echo "Choose a tag ref or fill source_tag." >&2
            exit 1
          fi

          if [[ -z "$TAG" || "$TAG" == "latest" ]]; then
            echo "source_tag must be a real release tag, not latest." >&2
            exit 1
          fi

          if ! gh release view "$TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "No published GitHub release found for tag: $TAG" >&2
            exit 1
          fi

          IS_PRERELEASE="$(gh release view "$TAG" -R "$GH_REPO" --json isPrerelease --jq '.isPrerelease')"
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "Prerelease $TAG will not be synced to Gitee latest." >&2
            exit 1
          fi

          SOURCE_COMMIT="$(gh api "repos/${GH_REPO}/commits/$TAG" --jq '.sha')"
          VERSION="${TAG#v}"
          EXPECTED_LITE_SETUP="XhMonitor-v$VERSION-Lite-Setup.exe"

          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "EXPECTED_LITE_SETUP=$EXPECTED_LITE_SETUP"
          } >> "$GITHUB_ENV"

      - name: Wait for GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 40); do
            ASSET_COUNT="$(gh api "repos/${GH_REPO}/releases/tags/$TAG" --jq '.assets | length')"
            HAS_LITE_SETUP="$(gh api "repos/${GH_REPO}/releases/tags/$TAG" --jq '.assets[].name' | grep -Fx "$EXPECTED_LITE_SETUP" || true)"

            echo "Attempt $attempt: assets=$ASSET_COUNT"
            if [[ "$ASSET_COUNT" -ge 5 && -n "$HAS_LITE_SETUP" ]]; then
              echo "GitHub release assets are ready."
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for GitHub release assets." >&2
          exit 1

      - name: Download GitHub Lite installer and release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf gitee-assets
          mkdir -p gitee-assets

          gh release download "$TAG" -R "$GH_REPO" -p "$EXPECTED_LITE_SETUP" -D gitee-assets
          gh release view "$TAG" -R "$GH_REPO" --json body --jq '.body // ""' > release-body.txt

          echo "Downloaded Gitee sync assets:"
          ls -lah gitee-assets

      - name: Push release tags to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GITEE_TOKEN:-}" ]]; then
            echo "Missing GitHub secret: GITEE_TOKEN" >&2
            exit 1
          fi

          git remote add gitee "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          if git ls-remote --exit-code gitee "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Gitee tag already exists: $TAG"
          else
            git push gitee "refs/tags/$TAG:refs/tags/$TAG"
          fi

          git tag -f latest "$SOURCE_COMMIT"
          git push gitee "refs/tags/latest:refs/tags/latest" --force
          echo "Gitee tags are ready."

      - name: Sync Gitee releases and Lite installer
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GITEE_TOKEN:-}" ]]; then
            echo "Missing GitHub secret: GITEE_TOKEN" >&2
            exit 1
          fi

          api_get() {
            local path="$1"
            local body_file="${2:-}"
            if [[ -n "$body_file" ]]; then
              curl -sS -G "$GITEE_API_BASE$path" \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                -w "%{http_code}" \
                -o "$body_file"
            else
              curl -sS -G "$GITEE_API_BASE$path" \
                --data-urlencode "access_token=$GITEE_TOKEN"
            fi
          }

          api_post() {
            local path="$1"
            shift
            curl -sS -X POST "$GITEE_API_BASE$path" \
              -d "access_token=$GITEE_TOKEN" \
              "$@"
          }

          api_delete() {
            local path="$1"
            curl -sS -X DELETE "$GITEE_API_BASE$path" \
              -d "access_token=$GITEE_TOKEN"
          }

          get_tag_commit_sha() {
            local tag="$1"
            local remote_ref

            remote_ref="$(git ls-remote gitee "refs/tags/$tag^{}" | awk '{print $1}' | head -n 1)"
            if [[ -n "$remote_ref" ]]; then
              echo "$remote_ref"
              return
            fi

            git ls-remote gitee "refs/tags/$tag" | awk '{print $1}' | head -n 1
          }

          ensure_tag() {
            local tag="$1"
            local target="$2"
            local current_sha

            current_sha="$(get_tag_commit_sha "$tag")"
            if [[ "$current_sha" != "$target" ]]; then
              echo "Gitee tag $tag points to '${current_sha:-missing}', expected $target." >&2
              exit 1
            fi

            echo "Gitee tag verified: $tag -> $target"
          }

          get_release_id() {
            local tag="$1"
            local status
            status="$(api_get "/repos/$GITEE_OWNER/$GITEE_REPO/releases/tags/$tag" "release-response.json")"

            if [[ "$status" == "200" ]]; then
              jq -r '.id' release-response.json
              return
            fi

            if [[ "$status" == "404" ]]; then
              echo ""
              return
            fi

            echo "Failed to check Gitee release $tag, HTTP $status" >&2
            cat release-response.json >&2
            exit 1
          }

          ensure_release() {
            local tag="$1"
            local title="$2"
            local body_file="$3"
            local release_id

            release_id="$(get_release_id "$tag")"
            if [[ -n "$release_id" && "$release_id" != "null" ]]; then
              echo "$release_id"
              return
            fi

            echo "Creating Gitee release: $tag" >&2
            api_post "/repos/$GITEE_OWNER/$GITEE_REPO/releases" \
              --data-urlencode "tag_name=$tag" \
              --data-urlencode "name=$title" \
              --data-urlencode "body@${body_file}" \
              --data-urlencode "target_commitish=dev" > release-create-response.json

            jq -r '.id' release-create-response.json
          }

          delete_release_if_exists() {
            local tag="$1"
            local release_id

            release_id="$(get_release_id "$tag")"
            if [[ -z "$release_id" || "$release_id" == "null" ]]; then
              return
            fi

            echo "Deleting existing Gitee release for tag: $tag"
            api_delete "/repos/$GITEE_OWNER/$GITEE_REPO/releases/$release_id" > /dev/null
          }

          upload_asset_with_overwrite() {
            local release_id="$1"
            local asset="$2"
            local name
            local size_mb
            local attachment_id

            name="$(basename "$asset")"
            size_mb="$(awk "BEGIN { printf \"%.2f\", $(stat -c '%s' "$asset") / 1024 / 1024 }")"

            api_get "/repos/$GITEE_OWNER/$GITEE_REPO/releases/$release_id/attach_files" > attachments.json
            attachment_id="$(jq -r --arg name "$name" '.[]? | select(.name == $name) | .id' attachments.json | head -n 1)"

            if [[ -n "$attachment_id" && "$attachment_id" != "null" ]]; then
              echo "Deleting existing Gitee attachment: $name"
              api_delete "/repos/$GITEE_OWNER/$GITEE_REPO/releases/$release_id/attach_files/$attachment_id" > /dev/null
            fi

            echo "Uploading Gitee attachment: $name (${size_mb} MB)"
            curl --fail-with-body --show-error --connect-timeout 30 --max-time "$GITEE_UPLOAD_MAX_TIME_SECONDS" \
              -X POST "$GITEE_API_BASE/repos/$GITEE_OWNER/$GITEE_REPO/releases/$release_id/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$asset" > upload-response.json
          }

          LITE_SETUP_PATH="gitee-assets/$EXPECTED_LITE_SETUP"
          if [[ ! -f "$LITE_SETUP_PATH" ]]; then
            echo "Lite setup asset not found: $LITE_SETUP_PATH" >&2
            exit 1
          fi

          ensure_tag "$TAG" "$SOURCE_COMMIT"
          SOURCE_RELEASE_ID="$(ensure_release "$TAG" "$TAG" "release-body.txt")"
          upload_asset_with_overwrite "$SOURCE_RELEASE_ID" "$LITE_SETUP_PATH"

          delete_release_if_exists latest
          ensure_tag latest "$SOURCE_COMMIT"
          {
            echo "同步自正式 release $TAG"
            echo
            cat release-body.txt
          } > latest-release-body.txt

          LATEST_RELEASE_ID="$(ensure_release latest "v$VERSION" "latest-release-body.txt")"
          upload_asset_with_overwrite "$LATEST_RELEASE_ID" "$LITE_SETUP_PATH"
