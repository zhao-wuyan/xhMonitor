[package]
name = "xhm-poc-slint"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1"
